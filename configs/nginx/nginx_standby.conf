# =============================================================================
# CN Project — Standby Edge (Mac 3 — Krishiv) | Phase 2 Extension E
# Standby IP:  10.7.28.25
# Backend A:   10.7.28.25:3001   (Mac 3 — Krishiv)
# Backend B:   10.7.2.96:3002    (Mac 4 — Vaidehi)
# Domain:      app.team1.test
# HTTPS:       port 8443  (TLS termination)
# =============================================================================

upstream backend_nodes {
    server 10.7.28.25:3001;  # Backend A — Mac 3 (Krishiv)
    server 10.7.2.96:3002;   # Backend B — Mac 4 (Vaidehi)
}

server {
    listen      8443 ssl;
    server_name app.team1.test 10.7.28.25;

    ssl_certificate     /opt/homebrew/etc/nginx/team1.test.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/team1.test.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    access_log  /opt/homebrew/var/log/nginx/standby_access.log;
    error_log   /opt/homebrew/var/log/nginx/standby_error.log;

    location /health {
        return 200 '{"edge":"standby-mac3","status":"ok","ip":"10.7.28.25","proto":"https"}';
        add_header Content-Type application/json;
    }

    location / {
        proxy_pass         http://backend_nodes;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout  5s;
        proxy_send_timeout     10s;
        proxy_read_timeout     10s;
        proxy_pass_header  X-Backend;
    }
}
