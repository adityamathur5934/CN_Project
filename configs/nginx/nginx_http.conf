# =============================================================================
# CN Project — Mac 2 (P2 — Aditya) | Script 4: HTTP Reverse Proxy + Load Balancer
# Edge IP:     10.7.17.151
# Backend A:   10.7.16.201:3001   (Mac 3 — Krishiv)
# Backend B:   10.7.16.36:3002  (Mac 4 — Vaidehi)
# Domain:      app.team.test  (update 'team' once name is finalised)
# Listens on:  8080 (HTTP — no sudo needed via Homebrew)
# NOTE: TLS/HTTPS added in Script 5. Do NOT configure it here.
# =============================================================================

# ── Upstream pool — round-robin (default) ────────────────────────────────────
upstream backend_nodes {
    server 10.7.16.201:3001;    # Backend A — Mac 3 (Krishiv)
    server 10.7.16.36:3002;   # Backend B — Mac 4 (Vaidehi)
}

# ── HTTP server ───────────────────────────────────────────────────────────────
server {
    listen      8080;
    server_name app.team1.test 10.7.17.151;

    # ── Access + error logs ─────────────────────────────────────────────────
    access_log  /opt/homebrew/var/log/nginx/team_access.log;
    error_log   /opt/homebrew/var/log/nginx/team_error.log;

    # ── Health check endpoint (edge itself responds) ────────────────────────
    location /health {
        return 200 '{"edge":"mac2","status":"ok","ip":"10.7.17.151"}';
        add_header Content-Type application/json;
    }

    # ── Proxy all other requests to the backend pool ────────────────────────
    location / {
        proxy_pass         http://backend_nodes;

        # Preserve the original client info
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — reasonable for a local LAN
        proxy_connect_timeout  5s;
        proxy_send_timeout     10s;
        proxy_read_timeout     10s;

        # Pass backend response headers through (includes X-Backend: A/B)
        proxy_pass_header  X-Backend;
    }
}
