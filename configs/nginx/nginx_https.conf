# =============================================================================
# CN Project — Mac 2 (P2 — Aditya) | Script 4 + Script 5: HTTP + HTTPS
# Edge IP:     10.7.17.151
# Backend A:   10.7.16.201:3001   (Mac 3 — Krishiv)
# Backend B:   10.7.16.36:3002  (Mac 4 — Vaidehi)
# Domain:      app.team1.test
# HTTP:        port 8080  (redirect to HTTPS)
# HTTPS:       port 8443  (TLS termination)
# Cert:        configs/tls/team1.test.crt
# =============================================================================

# ── Upstream pool — round-robin (default) ────────────────────────────────────
upstream backend_nodes {
    server 10.7.16.201:3001;    # Backend A — Mac 3 (Krishiv)
    server 10.7.16.36:3002;   # Backend B — Mac 4 (Vaidehi)
}

# ── HTTP server — redirect everything to HTTPS ───────────────────────────────
server {
    listen      8080;
    server_name app.team1.test 10.7.17.151;

    access_log  /opt/homebrew/var/log/nginx/team_access.log;
    error_log   /opt/homebrew/var/log/nginx/team_error.log;

    # Health check stays on HTTP (useful for quick LAN checks)
    location /health {
        return 200 '{"edge":"mac2","status":"ok","ip":"10.7.17.151","proto":"http"}';
        add_header Content-Type application/json;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ── HTTPS server — TLS termination + reverse proxy ───────────────────────────
server {
    listen      8443 ssl;
    server_name app.team1.test 10.7.17.151;

    # ── TLS certificate ──────────────────────────────────────────────────────
    ssl_certificate     /Users/aditya.2024/Documents/Projects/CN_Project/configs/tls/team1.test.crt;
    ssl_certificate_key /Users/aditya.2024/Documents/Projects/CN_Project/configs/tls/team1.test.key;

    # ── TLS hardening ────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log  /opt/homebrew/var/log/nginx/team_access.log;
    error_log   /opt/homebrew/var/log/nginx/team_error.log;

    # ── Health check (HTTPS) ─────────────────────────────────────────────────
    location /health {
        return 200 '{"edge":"mac2","status":"ok","ip":"10.7.17.151","proto":"https"}';
        add_header Content-Type application/json;
    }

    # ── Proxy all requests to backend pool ───────────────────────────────────
    location / {
        proxy_pass         http://backend_nodes;

        # Client info forwarding
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Timeouts
        proxy_connect_timeout  5s;
        proxy_send_timeout     10s;
        proxy_read_timeout     10s;

        # Pass backend headers through (X-Backend: A / B)
        proxy_pass_header  X-Backend;
    }
}
