#
# Policy:
#   - Loopback traffic on 127.0.0.1 to port 3002: PASS (always)
#   - Mac 2 (10.7.11.31) inbound to port 3002: PASS
#   - All other inbound to port 3002: BLOCK
#
# Note: MAC2_IP=10.7.11.31 — confirm with Aditya before activating.
