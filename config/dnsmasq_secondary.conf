# Secondary DNS server configuration for CN Project — Phase 2 Extension A
# Run this on a secondary host (Mac 4 / Vaidehi — 10.7.2.96, or Mac 3 / Krishiv — 10.7.28.25)
# to provide backup DNS if the primary dnsmasq on Mac 1 (10.7.10.8) goes down.
#
# Start:   sudo /opt/homebrew/sbin/dnsmasq -C /path/to/dnsmasq_secondary.conf
# Stop:    sudo killall dnsmasq
# Check:   pgrep -fl dnsmasq

port=53
# Replace <SECONDARY_MAC_IP> with the actual IP of the machine running this config.
# Example for Mac 4: listen-address=127.0.0.1,10.7.2.96
# Example for Mac 3: listen-address=127.0.0.1,10.7.28.25
listen-address=127.0.0.1,10.7.2.96
bind-interfaces

# Phase 2 Extension B: same short TTL as primary
local-ttl=30

# Serve the same records as the primary
address=/app.team1.test/10.7.11.31
address=/api.team1.test/10.7.11.31
